name: Verify public package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run offline consistency checks
        run: python scripts/verify_portfolio.py

      - name: Check Python syntax
        run: python scripts/tests/test_source_syntax.py

      - name: Check shell syntax
        run: bash -n scripts/docking/*.sh

  scientific-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create pinned RDKit analysis environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment/environment_analysis.yml
          cache-environment: true
          cache-downloads: true
          post-cleanup: all

      - name: Recalculate scientific summaries from fixed inputs and raw evidence
        run: |
          python scripts/tests/test_source_syntax.py
          python scripts/tests/test_scientific_regression.py
